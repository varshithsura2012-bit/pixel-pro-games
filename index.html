<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Pro Games</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #000;
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-size: 38px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    .container {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .game {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      border: 1px solid #333;
    }

    .game h2 {
      margin-bottom: 10px;
    }

    .game p {
      color: #aaa;
      margin-bottom: 15px;
    }

    .play {
      display: inline-block;
      padding: 10px 20px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .play:hover {
      background: #ddd;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 Pixel Pro Games</h1>
    <p>Play free games online</p>
  </header>

  <div class="container">

    <h2>🔥 Featured Games</h2>

    <div class="games">

      <div class="game">
        <h2>🏃 Pixel Runner</h2>
        <p>Run, jump and survive!</p>
        <a class="play" href="runner.html">PLAY</a>
      </div>

      <div class="game">
        <h2>🚀 Space Attack</h2>
        <p>Defend the galaxy!</p>
        <a class="play" href="#">PLAY</a>
      </div>

      <div class="game">
        <h2>🧩 Puzzle Master</h2>
        <p>Test your brain!</p>
        <a class="play" href="#">PLAY</a>
      </div>

      <div class="game">
        <h2>⚔️ Pixel Battle</h2>
        <p>Enter the battle!</p>
        <a class="play" href="#">PLAY</a>
      </div>

    </div>

  </div>

  <footer>
    © 2026 Pixel Pro Games
  </footer>

</body>
</html>
